# Full Fine-tuning Configuration for Moshi 7B
# This configuration trains ALL model parameters (no LORA)

# data
data:
  eval_data: '' # Optional Fill
  shuffle: true
  train_data: '' # Fill

# model
moshi_paths: 
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

# Full fine-tuning settings
full_finetuning: true # Enable full fine-tuning of all parameters
lora:
  enable: false # Must be False for full fine-tuning
  rank: 128 # Not used when enable: false
  scaling: 2. # Not used when enable: false
  ft_embed: false # Not used when enable: false

first_codebook_weight_multiplier: 100.
text_padding_weight: .5

# optim - adjusted for full fine-tuning
duration_sec: 100
batch_size: 8  # Reduced batch size due to higher memory requirements
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 1e-6  # Lower learning rate for full fine-tuning
  weight_decay: 0.1
  pct_start: 0.05

# other
seed: 0
log_freq: 1
eval_freq: 100
do_eval: false
do_ckpt: true
ckpt_freq: 100

save_adapters: false # Must be False for full fine-tuning (saves full model)

run_dir: ""  # Fill

# This part is optional and can be kept commented out
# wandb:
#   project: "" # your wandb project name
#   run_name: "" # your wandb run name
#   key: "" # your wandb api key
#   offline: False